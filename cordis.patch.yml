# @quill507/dsh-auto-approval-llm bundle layer.
#
# Preset contract: the "auto" preset MUST keep approval: ask. The plugin's
# autoSwitchPolicyToAsk guard (below) flips a never-policy auto session back
# to ask at runtime; never relax this preset to approval: never.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      auto:
        sandbox: danger-full-access
        # Keep in sync with autoSwitchPolicyToAsk: this static "ask" is the
        # first line of defense, the runtime guard is the second.
        approval: ask
        name: Auto
        description: High-privilege execution with automatic safety classification and approval for risky actions.
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# Premise: the host base patch (dsh-base cordis.patch.yml) pins the approval
# service policy to 'never' when DSH_PERMISSION_MODE=danger-full-access, and
# the preset derive falls back to that base policy — cold sessions then derive
# as danger-full-access, never as auto, so this plugin stays inactive (the
# runtime autoSwitchPolicyToAsk guard cannot help: it only flips sessions that
# already derived as auto). Keep the base policy at its default 'ask' wherever
# auto approval is expected.
#
# Config values are pinned against the z.object defaults in src/index.ts.
# The plugin's loader ENTRY is created by this insert row — the profile
# bundles array only supplies patch layers, it does not create entries.
# 2026-08-30 regression note: removing the insert (or keeping only id-targeted
# config rows) leaves the plugin with no loader entry -> all plugin routes 404.
# A duplicate-apply crash came from this insert PLUS the
# super-injector runtime re-injecting the same package from its registry;
# the registry no longer lists this plugin, so the insert alone is the single
# entry source and the config rows below are the shipped defaults.
- insert:
    - id: auto-approval-llm
      name: '@quill507/dsh-auto-approval-llm'
      config:
        enabled: true
        # OVERRIDE of code default (false): ship the never->ask policy guard
        # ON so a bundle install cannot run the auto preset unapproved.
        autoSwitchPolicyToAsk: true
        timeoutAction: reject
        allowlist: []
        denyList: []
        # Equals code default ([]): bash is not pinned to human review; the
        # classifier and LLM review pipeline handle it (unreadable destructive
        # shell still stays on the one-shot human path via shell.ts).
        humanOnlyList: []
        # Equals code defaults (see src/index.ts Config):
        maxConsecutiveDenials: 3
        maxTotalDenials: 20
        maxArgsChars: 4000
        notifyUser: true
